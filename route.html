<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>路線走破</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Noto+Sans+JP:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --blue:#1f5aa6; --blue-soft:#e6eef9; --ink:#1d232b; --sub:#6b7480; --faint:#9aa2ad;
    --line:#e5e8ec; --sheet:#fff; --bg2:#f4f5f7; --red:#c62828; --green:#2e7d32;
  }
  html, body { margin:0; height:100%; overflow:hidden; color:var(--ink); background:#eceae3;
    font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; }
  #map { position:absolute; inset:0; }
  .num { font-variant-numeric: tabular-nums; }
  button { font:inherit; color:inherit; }
  input[type=file] { display:none; }

  /* ---- 地図の上の丸ボタン ---- */
  #fabs { position:absolute; right:12px; top:calc(12px + env(safe-area-inset-top)); z-index:3;
    display:flex; flex-direction:column; gap:10px; }
  .fab { width:44px; height:44px; border-radius:50%; border:none; background:#fff;
    box-shadow:0 2px 8px rgba(0,0,0,.22); display:grid; place-items:center; cursor:pointer; padding:0; }
  .fab svg { width:22px; height:22px; stroke:var(--ink); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .fab.off svg { stroke:var(--faint); }
  .fab.on { background:var(--blue-soft); } .fab.on svg { stroke:var(--blue); }
  .fab.primary { background:var(--blue); } .fab.primary svg { stroke:#fff; }
  .me { width:16px; height:16px; border-radius:50%; background:#1a73e8; border:3px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,.2), 0 0 10px rgba(26,115,232,.6); }

  /* ---- 引き出しパネル ---- */
  #sheet { position:absolute; left:0; right:0; bottom:0; z-index:4; background:var(--sheet);
    border-radius:16px 16px 0 0; box-shadow:0 -2px 14px rgba(0,0,0,.18);
    display:flex; flex-direction:column; height:160px; transition:height .25s ease; }
  #sheet.dragging { transition:none; }
  #grab { padding:8px 0 4px; cursor:grab; touch-action:none; }
  #grab i { display:block; width:40px; height:5px; border-radius:3px; background:#cfd4da; margin:0 auto; }
  .tabs { display:flex; gap:4px; padding:0 12px 8px; border-bottom:1px solid var(--line); }
  .tab { flex:1; border:none; background:none; padding:8px 0; border-radius:8px; font-size:14px; color:var(--sub); cursor:pointer; position:relative; }
  .tab.on { background:var(--blue-soft); color:var(--blue); font-weight:600; }
  .tab.more { flex:0 0 48px; font-size:18px; line-height:1; }
  .tab .dot { position:absolute; top:6px; margin-left:3px; width:7px; height:7px; border-radius:50%; background:#f0a020; }
  .pane { flex:1; overflow-y:auto; padding:0 0 calc(16px + env(safe-area-inset-bottom)); display:none; -webkit-overflow-scrolling:touch; }
  .pane.on { display:block; }
  .empty { padding:16px; font-size:13px; color:var(--sub); line-height:1.6; }

  /* ---- 路線カード ---- */
  .route { border-bottom:1px solid var(--line); }
  .rhead { display:flex; align-items:center; gap:10px; padding:12px 16px 4px; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .rhead .sgw { flex:0 0 30px; display:grid; place-items:center; }
  .rhead .nm { font-size:17px; font-weight:700; min-width:0; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rhead .km { font-size:12px; color:var(--faint); white-space:nowrap; text-align:right; }
  .rhead .km .ov.none { visibility:hidden; }
  .rhead .chev { color:var(--faint); transition:transform .2s; }
  .route.open .chev { transform:rotate(90deg); }
  .icon-btn { border:none; background:none; padding:6px; border-radius:6px; color:var(--faint); cursor:pointer; font-size:13px; white-space:nowrap; }
  .prog { display:flex; align-items:center; gap:10px; padding:0 16px 12px 56px; font-size:13px; color:var(--sub); }
  .prog .t { white-space:nowrap; }
  .gauge { flex:1; height:6px; background:#e7eaee; border-radius:3px; overflow:hidden; min-width:60px; }
  .gauge div { height:100%; background:var(--blue); border-radius:3px; }
  .prog .ex { font-size:11px; color:var(--faint); white-space:nowrap; }

  .units { display:none; padding:0 0 12px; }
  .route.open .units { display:block; }
  .units .cap { font-size:12px; color:var(--sub); padding:4px 16px 6px; }
  .units ul { list-style:none; margin:0; padding:0; }
  .grp { position:sticky; top:0; z-index:1; background:#f0f3f7; color:var(--sub);
    font-size:12px; font-weight:600; padding:5px 16px; border-top:1px solid var(--line); }
  .u { display:flex; align-items:center; gap:10px; padding:9px 16px; border-top:1px solid #f1f2f4; font-size:14px; }
  .u .no { color:var(--faint); font-size:12px; flex:0 0 26px; }
  .u .nm { min-width:0; }
  .u .yomi { font-size:11px; color:var(--faint); margin-left:6px; }
  .u .r { margin-left:auto; display:flex; align-items:center; gap:8px; font-size:12px; color:var(--sub); white-space:nowrap; }
  .u .ok { color:var(--green); font-size:16px; font-weight:700; }
  .u.part .d { color:var(--blue); }
  .u.ex .nm, .u.ex .no { color:var(--faint); text-decoration:line-through; }
  .u .exb { border:1px solid var(--line); background:#fff; border-radius:6px; padding:3px 8px; font-size:11px; color:var(--sub); cursor:pointer; }
  .units .tools { display:flex; gap:8px; padding:10px 16px 0; }
  .units .tools button { border:1px solid var(--line); background:#fff; border-radius:8px; padding:7px 10px; font-size:12px; color:var(--sub); cursor:pointer; }

  #addBar { padding:10px 16px; border-bottom:1px solid var(--line); background:#fff; }
  #addBar[hidden] { display:none; }
  .add { display:flex; align-items:center; justify-content:center; gap:6px; margin:0; padding:10px;
    border:1.5px dashed #c8ced6; border-radius:10px; color:var(--blue); background:none; width:100%; cursor:pointer; font-size:14px; }
  .units .tools .clr { color:var(--red); }
  #fabNorth[hidden] { display:none; }
  #fabNorth svg { transition:transform .1s linear; }

  /* ---- 軌跡タブ ---- */
  .sec { font-size:12px; color:var(--sub); padding:14px 16px 6px; font-weight:600; }
  .trk { margin:0 16px 8px; border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .trk.pending { border-color:#f0c36d; background:#fffaf0; }
  .trk.hidden { opacity:.55; }
  .trk .top { display:flex; align-items:center; gap:8px; }
  .trk .fn { font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .trk .meta { font-size:12px; color:var(--sub); margin-top:2px; }
  .trk .acts { display:flex; gap:8px; margin-top:10px; }
  .trk .top .icon-btn:first-of-type { margin-left:auto; }
  .btn { border:1px solid var(--blue); background:#fff; color:var(--blue); border-radius:8px; padding:8px 14px; font-size:14px; cursor:pointer; text-align:center; }
  .btn.primary { background:var(--blue); color:#fff; }
  .btn.ghost { border-color:var(--line); color:var(--sub); }
  .btn:disabled { opacity:.45; }
  .sw { width:10px; height:10px; border-radius:50%; flex:0 0 auto; }
  .wide { display:block; margin:10px 16px 0; width:calc(100% - 32px); box-sizing:border-box; }

  /* ---- ⋯ タブ ---- */
  .menu { list-style:none; margin:8px 0 0; padding:0; }
  .menu li { border-bottom:1px solid var(--line); }
  .menu li > label, .menu li > button { display:block; width:100%; text-align:left; border:none; background:none; padding:14px 16px; font-size:15px; cursor:pointer; box-sizing:border-box; }
  .menu small { display:block; color:var(--sub); font-size:12px; margin-top:2px; }
  .menu .danger { color:var(--red); }
  textarea.sql { display:block; margin:8px 16px; width:calc(100% - 32px); box-sizing:border-box; height:140px; font-size:11px; font-family:ui-monospace,Menlo,monospace; }

  /* ---- 路線の一覧(全画面) ---- */
  #cat { position:absolute; inset:0; z-index:10; background:#fff; display:none; flex-direction:column; }
  #cat.on { display:flex; }
  #cat header { display:flex; align-items:center; gap:8px; padding:calc(10px + env(safe-area-inset-top)) 12px 10px; border-bottom:1px solid var(--line); }
  #cat header h2 { font-size:17px; margin:0; flex:1; }
  #catQ { margin:10px 12px; padding:10px 12px; border-radius:10px; border:none; background:var(--bg2); font-size:16px; }
  #catList { flex:1; overflow-y:auto; padding-bottom:calc(16px + env(safe-area-inset-bottom)); }
  .sech { position:sticky; top:0; z-index:1; background:#fff; font-size:12px; color:var(--sub); font-weight:600; padding:10px 16px 6px; border-bottom:1px solid var(--line); }
  .ci { display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid #f1f2f4; }
  .ci .sgw { flex:0 0 32px; display:grid; place-items:center; }
  .ci .tx { flex:1; min-width:0; }
  .ci .tx b { display:block; font-size:15px; }
  .ci .tx small { color:var(--faint); font-size:12px; }
  .ci .use { border:1px solid var(--blue); color:var(--blue); background:#fff; border-radius:16px; padding:5px 12px; font-size:13px; cursor:pointer; white-space:nowrap; }
  .ci .use.on { background:var(--blue); color:#fff; }
  .ci .dl { border:none; background:none; padding:6px; cursor:pointer; }
  .ci .dl svg { width:20px; height:20px; fill:none; stroke:var(--faint); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .ci .dl.saved svg { stroke:var(--green); }
  .ci .dl.busy { opacity:.4; }
  .caterr { padding:16px; font-size:13px; color:var(--sub); line-height:1.6; }
  .caterr small { display:block; white-space:pre-wrap; color:var(--red); margin-top:6px; }

  #toast { position:absolute; left:50%; top:calc(16px + env(safe-area-inset-top)); transform:translateX(-50%);
    background:rgba(29,35,43,.9); color:#fff; font-size:13px; padding:8px 14px; border-radius:14px; z-index:20;
    opacity:0; transition:opacity .2s; pointer-events:none; max-width:calc(100% - 32px); width:max-content; box-sizing:border-box; white-space:pre-line; line-height:1.5; }
  #toast.on { opacity:1; }

  /* ---- 発見バナー(シンプル版) ---- */
  #banner-layer { position:fixed; left:0; right:0; top:14%; display:flex; justify-content:center; pointer-events:none; z-index:30; }
  .simple { color:#fff; text-align:center; white-space:nowrap; font-size:clamp(18px,5vw,28px); font-weight:500;
    letter-spacing:.4em; padding-left:.4em; text-shadow:0 0 4px rgba(0,0,0,.85), 0 1px 10px rgba(0,0,0,.5); }
  .simple span { display:inline-block; opacity:0; animation:s-in var(--dur,700ms) ease forwards; }
  .simple.out span { opacity:1; animation:s-out var(--dur,700ms) ease forwards; }
  @keyframes s-in { from { opacity:0; } to { opacity:1; } }
  @keyframes s-out { from { opacity:1; } to { opacity:0; } }
</style>
</head>
<body>
<div id="map"></div>
<div id="banner-layer"></div>

<div id="fabs">
  <button class="fab" id="fabNorth" title="北を上にする" hidden><svg viewBox="0 0 24 24" style="stroke:none"><path d="M12 2l4 10h-8z" fill="#d32f2f"/><path d="M12 22l-4-10h8z" fill="#9aa2ad"/></svg></button>
  <button class="fab" id="fabLoc" title="現在地"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7"/></svg></button>
  <button class="fab" id="fabTrk" title="軌跡を隠す/表示"><svg viewBox="0 0 24 24"><path d="M4 18c3-6 6 2 9-4s4-6 7-8"/><circle cx="4" cy="18" r="1.5"/><circle cx="20" cy="6" r="1.5"/></svg></button>
  <label class="fab primary" for="fGpx" title="GPXを読み込む"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></label>
</div>
<input id="fGpx" type="file" accept=".gpx,application/gpx+xml,text/xml" multiple>
<input id="fRoute" type="file" accept=".geojson,.json" multiple>

<div id="sheet">
  <div id="grab"><i></i></div>
  <div class="tabs">
    <button class="tab on" data-p="pRoutes">路線</button>
    <button class="tab" data-p="pTracks">軌跡</button>
    <button class="tab more" data-p="pMore" aria-label="その他">⋯</button>
  </div>
  <div id="addBar"><button class="add" id="btnAdd">＋ 路線を追加</button></div>
  <div class="pane on" id="pRoutes"></div>
  <div class="pane" id="pTracks"></div>
  <div class="pane" id="pMore">
    <ul class="menu">
      <li><label for="fRoute">ファイルから路線を読み込む<small>一覧(routes.json)に無い路線ファイルを直接開く</small></label></li>
      <li><button id="btnSql">除外の設定をSQLで表示<small>PostGIS の unit_manual に書き戻すためのSQL</small></button></li>
      <li id="sqlBox" hidden><textarea class="sql" readonly></textarea></li>
      <li><button id="btnReset" class="danger">記録をリセット<small>この端末に保存した走破記録をすべて消す</small></button></li>
    </ul>
  </div>
</div>

<div id="cat">
  <header>
    <button class="icon-btn" id="catClose" style="font-size:24px;color:var(--ink);padding:2px 10px">‹</button>
    <h2>路線を追加</h2>
  </header>
  <input id="catQ" type="search" placeholder="番号・路線名で探す(例:112、山形)">
  <div id="catList"></div>
</div>

<div id="toast"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
// ===== 設定 =====
const STEP_M = 50;               // 軌跡を区切る長さ(m)
const MAX_GAP_MIN = 30;          // これより時間が空いた2点はつながない(別の日・別の移動とみなす)
const STORE_KEY = 'road_progress_v1';
const APP_KEY = 'road_app_v1';
const CACHE = 'routes-v1';
const TRACK_COLORS = ['#e65100', '#6a1b9a', '#00838f', '#c2185b', '#2e7d32', '#5d4037', '#283593'];
// ================

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const pad3 = n => String(n).padStart(3, '0');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const Sign = (() => {
  // 色:見本画像から取った青/未着手の灰色/白/外周の細い線
  const BLUE = '#0140ff', GREY = '#a9b0b9', WHITE = '#fff', EDGE = '#c0c0c0';
  const NUMF = "'Roboto','Helvetica Neue',Arial,sans-serif";
  const JPF = "'Noto Sans JP','Hiragino Sans',sans-serif";
  let seq = 0;
  // 外周の細い線 → 白い縁 → 中の色、の順に重ねる
  function body(shape, box, p) {
    const base = shape(EDGE, 30) + shape(WHITE, 26);
    if (p == null || p <= 0) return base + shape(GREY, 0);
    if (p >= 1) return base + shape(BLUE, 0);
    const id = 'sg' + (++seq), [x, y, w, h] = box;
    return base + shape(GREY, 0) +
      `<clipPath id="${id}"><rect x="${x}" y="${y + h * (1 - p)}" width="${w}" height="${h}"/></clipPath>` +
      `<g clip-path="url(#${id})">${shape(BLUE, 0)}</g>`;
  }
  const t = (s, x, y, size, opt = '') =>
    `<text x="${x}" y="${y}" font-size="${size}" fill="${WHITE}" text-anchor="middle" ${opt}>${s}</text>`;
  // 2〜3文字を、見本のように間を空けて並べる
  function spread(s, y, size, cx, gap) {
    const cs = [...s], n = cs.length, g = n >= 3 ? gap * .66 : gap;
    return cs.map((c, i) => t(c, cx + (i - (n - 1) / 2) * g, y, size, `font-family="${JPF}" font-weight="500"`)).join('');
  }
  function num(n, x, y, size, maxW) {
    const s = String(n);
    const fit = s.length >= 3 ? ` textLength="${maxW}" lengthAdjust="spacingAndGlyphs"` : '';
    return t(s, x, y, size, `font-family="${NUMF}" font-weight="500"${fit}`);
  }

  // 国道(118の2-A)。輪郭は見本画像からなぞったもの
  const OP = 'M227.0 17.6C232.9 17.6 238.9 17.7 244.8 17.9C250.8 18.1 256.8 18.5 262.7 18.9C268.6 19.3 274.6 19.7 280.5 20.2C286.4 20.7 292.4 21.3 298.3 22.0C304.2 22.7 310.1 23.5 316.0 24.4C321.9 25.3 327.8 26.2 333.6 27.3C339.5 28.4 345.3 29.5 351.1 30.8C356.9 32.1 362.8 33.5 368.4 35.3C374.0 37.2 379.5 39.2 384.8 41.8C390.0 44.4 395.1 47.4 399.7 50.9C404.3 54.5 408.7 58.5 412.5 62.9C416.4 67.2 419.9 72.0 422.8 77.0C425.7 82.1 428.1 87.6 429.9 93.1C431.7 98.6 433.0 104.4 433.6 110.2C434.3 116.0 434.4 122.0 434.1 127.8C433.7 133.7 432.7 139.5 431.5 145.3C430.3 151.1 428.7 156.8 427.1 162.5C425.4 168.2 423.3 173.8 421.4 179.4C419.4 185.1 417.5 190.7 415.4 196.3C413.3 201.8 410.9 207.3 408.7 212.8C406.4 218.3 404.1 223.8 401.6 229.2C399.1 234.6 396.5 239.9 393.8 245.3C391.2 250.6 388.5 255.9 385.7 261.1C382.8 266.4 379.8 271.5 376.8 276.6C373.8 281.7 370.7 286.9 367.6 291.9C364.4 297.0 361.1 301.9 357.9 306.9C354.6 311.9 351.3 316.9 347.9 321.7C344.5 326.6 340.9 331.4 337.3 336.1C333.7 340.8 330.0 345.5 326.3 350.1C322.5 354.7 318.6 359.2 314.7 363.7C310.8 368.1 306.9 372.6 302.9 376.9C298.8 381.2 294.8 385.6 290.4 389.5C286.1 393.4 281.6 397.1 276.7 400.3C271.8 403.5 266.7 406.3 261.3 408.6C255.9 410.8 250.2 412.7 244.5 413.8C238.8 415.0 232.8 415.6 227.0 415.6C221.2 415.6 215.2 415.0 209.5 413.8C203.8 412.7 198.1 410.8 192.7 408.6C187.3 406.3 182.2 403.5 177.3 400.3C172.4 397.1 167.9 393.4 163.6 389.5C159.2 385.6 155.2 381.2 151.1 376.9C147.1 372.6 143.2 368.1 139.3 363.7C135.4 359.2 131.5 354.7 127.7 350.1C124.0 345.5 120.3 340.8 116.7 336.1C113.1 331.4 109.5 326.6 106.1 321.7C102.7 316.9 99.4 311.9 96.1 306.9C92.9 301.9 89.6 297.0 86.4 291.9C83.3 286.9 80.2 281.7 77.2 276.6C74.2 271.5 71.2 266.3 68.3 261.1C65.4 255.9 62.7 250.6 60.0 245.3C57.3 240.0 54.7 234.7 52.2 229.3C49.7 223.9 47.4 218.4 45.2 212.9C42.9 207.4 40.7 201.8 38.6 196.3C36.5 190.7 34.6 185.1 32.6 179.4C30.7 173.8 28.6 168.2 26.9 162.5C25.3 156.8 23.7 151.1 22.5 145.3C21.3 139.5 20.3 133.7 19.9 127.8C19.6 122.0 19.7 116.0 20.4 110.2C21.0 104.4 22.3 98.6 24.1 93.1C25.9 87.6 28.3 82.1 31.2 77.0C34.1 72.0 37.6 67.2 41.5 62.9C45.3 58.5 49.7 54.5 54.3 50.9C58.9 47.4 64.0 44.4 69.2 41.8C74.5 39.2 80.0 37.2 85.6 35.3C91.2 33.5 97.1 32.1 102.9 30.8C108.7 29.5 114.5 28.4 120.4 27.3C126.2 26.2 132.1 25.3 138.0 24.4C143.9 23.5 149.8 22.7 155.7 22.0C161.6 21.3 167.6 20.7 173.5 20.2C179.4 19.7 185.4 19.3 191.3 18.9C197.2 18.5 203.2 18.1 209.2 17.9C215.1 17.7 221.1 17.6 227.0 17.6Z';
  function onigiri(n, p = 1, width = 56) {
    const sh = (c, sw) => `<path d="${OP}" fill="${c}"${sw ? ` stroke="${c}" stroke-width="${sw}" stroke-linejoin="round"` : ''}/>`;
    return `<svg viewBox="0 0 455 435" width="${width}" role="img" aria-label="国道${n}号">` +
      body(sh, [0, 18, 455, 400], p) +
      spread('国道', 98, 52, 227.5, 110) +
      num(n, 227.5, 266, 172, 262) +
      t('ROUTE', 227.5, 340, 46, `font-family="${NUMF}" font-weight="400"`) + '</svg>';
  }

  // 都道府県道(118の2-B)。pref は「山形県」「東京都」「北海道」など
  const HP = 'M114 53 H333 L426 224 L333 409 H114 L21 224 Z';
  function prefParts(pref) {
    if (pref === '北海道') return ['道道', '北海道'];
    const k = pref.slice(-1);
    return [(k === '都' || k === '府' ? k : '県') + '道', pref.replace(/[都府県]$/, '')];
  }
  function hexa(n, pref, p = 1, width = 56) {
    const [top, bottom] = prefParts(pref);
    const sh = (c, sw) => `<path d="${HP}" fill="${c}" stroke="${c}" stroke-width="${14 + sw}" stroke-linejoin="round"/>`;
    return `<svg viewBox="0 0 447 447" width="${width}" role="img" aria-label="${pref}道${n}号">` +
      body(sh, [0, 44, 447, 374], p) +
      spread(top, 112, 50, 223.5, 110) +
      num(n, 223.5, 292, 186, 310) +
      spread(bottom, 382, 50, 223.5, 110) + '</svg>';
  }
  return { onigiri, hexa };
})();

// route_ref(例 00-112、06-009)から標識の種類を決める
function refInfo(ref) {
  const m = /^(\d{2})-(\d+)/.exec(ref || '');
  if (!m) return null;
  const pc = +m[1], no = +m[2];
  return pc === 0 ? { kind: 'nat', no, pc } : { kind: 'pref', no, pc, pref: PREFS[pc - 1] || '' };
}
function signFor(ref, p, w) {
  const i = refInfo(ref);
  if (!i) return '';
  return i.kind === 'nat' ? Sign.onigiri(i.no, p, w) : Sign.hexa(i.no, i.pref, p, Math.round(w * .96));
}

// ---------- バナー ----------
const Banner = (() => {
  const layer = $('banner-layer'); const q = []; let busy = false;
  function show(o) { q.push(o); if (!busy) next(); }
  function next() {
    // 路線の一覧を閉じてから、お知らせが消えてから出す
    if (q.length && ($('cat').classList.contains('on') || $('toast').classList.contains('on'))) { busy = true; setTimeout(next, 300); return; }
    const o = q.shift(); if (!o) { busy = false; return; } busy = true;
    const step = 90, dur = 700, hold = 2500;
    const chars = [...(o.label ? o.label + ': ' + o.title : o.title)];
    const el = document.createElement('div'); el.className = 'simple'; el.style.setProperty('--dur', dur + 'ms');
    chars.forEach((c, i) => { const s = document.createElement('span'); s.textContent = c === ' ' ? ' ' : c; s.style.animationDelay = (i * step) + 'ms'; el.appendChild(s); });
    layer.appendChild(el);
    const sweep = (chars.length - 1) * step + dur;
    setTimeout(() => el.classList.add('out'), sweep + hold);
    setTimeout(() => { el.remove(); setTimeout(next, 250); }, sweep * 2 + hold);
  }
  // 待っている演出があれば、条件がそろうまで見張る
  function kick() { if (q.length && !busy) next(); }
  return { show, kick };
})();

// ---------- 判定のための計算 ----------
function haversine(a, b) {
  const R = 6371008.8, r = Math.PI / 180;
  const dLat = (b.lat - a.lat) * r, dLon = (b.lon - a.lon) * r;
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s));
}
function ringContains(ring, x, y) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const xi = ring[i][0], yi = ring[i][1], xj = ring[j][0], yj = ring[j][1];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
function polysOf(geom) {
  if (!geom) return [];
  if (geom.type === 'Polygon') return [geom.coordinates];
  if (geom.type === 'MultiPolygon') return geom.coordinates;
  return [];
}
function geomContains(polys, x, y) {
  for (const p of polys) {
    if (!ringContains(p[0], x, y)) continue;
    let inHole = false;
    for (let h = 1; h < p.length; h++) if (ringContains(p[h], x, y)) { inHole = true; break; }
    if (!inHole) return true;
  }
  return false;
}
function bboxOf(polys) {
  let b = [Infinity, Infinity, -Infinity, -Infinity];
  for (const p of polys) for (const c of p[0]) {
    if (c[0] < b[0]) b[0] = c[0]; if (c[1] < b[1]) b[1] = c[1];
    if (c[0] > b[2]) b[2] = c[0]; if (c[1] > b[3]) b[3] = c[1];
  }
  return b;
}
const inBox = (b, x, y) => x >= b[0] && x <= b[2] && y >= b[1] && y <= b[3];

// 1路線ぶんの判定:前回までの続き(lastTime より後)の区間だけを足し込む
function judgeRoute(route, pts) {
  const r = rec(route.ref);
  const last = r.lastTime ? Date.parse(r.lastTime) : null;
  const add = {};
  let maxT = last;
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i];
    if (a.t != null && b.t != null) {
      if (b.t - a.t > MAX_GAP_MIN * 60000) continue;
      if (last != null && b.t <= last) continue;
      if (maxT == null || b.t > maxT) maxT = b.t;
    }
    const minx = Math.min(a.lon, b.lon), maxx = Math.max(a.lon, b.lon);
    const miny = Math.min(a.lat, b.lat), maxy = Math.max(a.lat, b.lat);
    const rb = route.bbox;
    if (maxx < rb[0] || minx > rb[2] || maxy < rb[1] || miny > rb[3]) continue;
    const d = haversine(a, b);
    if (d === 0) continue;
    const n = Math.max(1, Math.ceil(d / STEP_M)), step = d / n;
    for (let k = 0; k < n; k++) {
      const f = (k + 0.5) / n;
      const x = a.lon + (b.lon - a.lon) * f, y = a.lat + (b.lat - a.lat) * f;
      for (const u of route.units) {
        if (inBox(u.bbox, x, y) && geomContains(u.polys, x, y)) { add[u.id] = (add[u.id] || 0) + step; break; }
      }
    }
  }
  return { add, maxT };
}

// ---------- GPXの読み込み ----------
function parseGpx(text) {
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('GPXの形式ではありません');
  const nodes = [...doc.getElementsByTagName('trkpt')];
  const pts = nodes.map(n => {
    const t = n.getElementsByTagName('time')[0];
    return { lat: +n.getAttribute('lat'), lon: +n.getAttribute('lon'), t: t ? Date.parse(t.textContent) : null };
  }).filter(p => isFinite(p.lat) && isFinite(p.lon));
  if (pts.every(p => p.t != null)) pts.sort((p, q) => p.t - q.t);
  return pts;
}

// ---------- 地図 ----------
const map = new maplibregl.Map({
  container: 'map', attributionControl: { compact: true },
  style: {
    version: 8,
    sources: { gsi: { type: 'raster', tiles: ['https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png'], tileSize: 256, maxzoom: 18,
      attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">地理院タイル</a> | 路線:© OpenStreetMap contributors' } },

  },

});
const mapReady = new Promise(res => map.on('load', res));

// ---------- 路線 ----------
const routes = [];   // { ref, name, km, file, units[], unitById, bbox, src, order }
let srcSeq = 0;
const str = v => v == null || v === '' ? '' : String(v);

async function addRoute(gj, label, file, opt = {}) {
  await mapReady;
  const feats = gj.features || [];
  const lines = feats.filter(f => f.properties.kind === 'line');
  const line = lines[0];
  const units = feats.filter(f => f.properties.kind === 'unit');
  if (!units.length) throw new Error(label + ':判定単位(kind=unit)がありません');
  const ref = units[0].properties.route_ref;
  if (routes.find(r => r.ref === ref)) return null;
  const name = (line && line.properties.name) || ref;
  const numOf = k => { const f = lines.find(f => f.properties[k] != null && f.properties[k] !== ''); return f ? +f.properties[k] : null; };
  const km = numOf('length_km'), ovKm = numOf('overlap_km');

  const u2 = units.map(f => {
    const P = f.properties, polys = polysOf(f.geometry), c = centerOf(polys);
    return { id: String(P.match_id),
             disp: str(P.label) ? str(P.gun_name) + str(P.label) : str(P.name) || String(P.match_id),
             yomi: str(P.label_yomi),
             grp: [str(P.pref), str(P.group_name)].filter(Boolean).join(' '),
             len: +P.len_m || 0, th: +P.threshold_m || 500, polys, bbox: bboxOf(polys),
             seq: P.seq != null ? +P.seq : null, lon: c[0], lat: c[1],
             fileEx: P.excluded === true || P.excluded === 'true' };
  });
  const bbox = u2.reduce((b, u) => [Math.min(b[0], u.bbox[0]), Math.min(b[1], u.bbox[1]), Math.max(b[2], u.bbox[2]), Math.max(b[3], u.bbox[3])],
                         [Infinity, Infinity, -Infinity, -Infinity]);
  const src = 'route-' + (srcSeq++);
  const before = firstTrackLayer();
  map.addSource(src, { type: 'geojson', data: gj, promoteId: 'match_id' });
  map.addLayer({ id: src + '-area', type: 'fill', source: src, filter: ['==', ['get', 'kind'], 'area'],
    paint: { 'fill-color': ['match', ['coalesce', ['feature-state', 'st'], 0], 2, '#1976d2', 1, '#64b5f6', 3, '#fff8e1', '#9e9e9e'],
             'fill-opacity': ['match', ['coalesce', ['feature-state', 'st'], 0], 2, 0.45, 1, 0.35, 3, 0.6, 0.15] } }, before);
  map.addLayer({ id: src + '-area-line', type: 'line', source: src, filter: ['==', ['get', 'kind'], 'area'],
    paint: { 'line-color': '#616161', 'line-width': 0.8 } }, before);
  // 路線の線:単独区間は赤、重用区間(自分より番号の小さい路線と重なる区間)は紫
  const isDup = ['all', ['==', ['get', 'kind'], 'line'], ['>', ['length', ['coalesce', ['get', 'dup_refs'], '']], 0]];
  map.addLayer({ id: src + '-line', type: 'line', source: src,
    filter: ['all', ['==', ['get', 'kind'], 'line'], ['==', ['length', ['coalesce', ['get', 'dup_refs'], '']], 0]],
    layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': '#d32f2f', 'line-width': 2.5 } }, before);
  map.addLayer({ id: src + '-dup', type: 'line', source: src, filter: isDup,
    layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': '#8e24aa', 'line-width': 4 } }, before);

  const startF = feats.find(f => f.properties.kind === 'start');
  const startPt = startF && startF.geometry ? firstCoord(startF.geometry) : null;
  const route = { ref, name, km, ovKm, file: file || null, units: u2, unitById: Object.fromEntries(u2.map(u => [u.id, u])), bbox, src,
                  order: orderUnits(u2, startPt) };
  if (opt.at != null) routes.splice(opt.at, 0, route); else routes.push(route);
  if (file && !app.active.includes(file)) { app.active.push(file); saveApp(); }
  render();
  if (!opt.quiet) {
    fitAll();
    // 路線を読み込んだ時点で「開始」を出す(すでに完走している路線は出さない)
    const t = targets(route);
    if (!(t.length && t.every(u => stateOf(route, u) === 2))) Banner.show({ label: '開始', title: name });
  }
  return route;
}
function dropRoute(r) {
  for (const id of [r.src + '-area', r.src + '-area-line', r.src + '-line', r.src + '-dup']) if (map.getLayer(id)) map.removeLayer(id);
  if (map.getSource(r.src)) map.removeSource(r.src);
  const i = routes.indexOf(r); if (i >= 0) routes.splice(i, 1);
  return i;
}
function removeRoute(r) {
  dropRoute(r);
  if (r.file) { app.active = app.active.filter(f => f !== r.file); saveApp(); }
  render(); renderCatalog();
}
async function replaceRoute(r, gj) {
  const at = dropRoute(r);
  await addRoute(gj, r.file, r.file, { quiet: true, at });
}

// ---------- 起点からの並び順 ----------
// 1) 判定単位に seq(起点からの順番)があればそれを使う
// 2) 無ければ、起点(kind=start の点)から「一番近い町村 → そこから一番近い町村 …」とたどる
//    起点が無いときは、いちばん離れた2つの町村を両端とみなし、片方から始める(入れ替えボタンで逆にできる)
function centerOf(polys) {
  let sx = 0, sy = 0, n = 0;
  for (const p of polys) for (const c of p[0]) { sx += c[0]; sy += c[1]; n++; }
  return n ? [sx / n, sy / n] : [0, 0];
}
function firstCoord(g) { let c = g.coordinates; while (Array.isArray(c[0])) c = c[0]; return { lon: c[0], lat: c[1] }; }
function orderUnits(units, startPt) {
  if (units.length && units.every(u => u.seq != null)) return [...units].sort((a, b) => a.seq - b.seq);
  if (units.length < 2) return [...units];
  let first;
  if (startPt) first = units.reduce((m, u) => haversine(startPt, u) < haversine(startPt, m) ? u : m);
  else {
    let best = -1;
    for (const a of units) for (const b of units) {
      const d = haversine(a, b);
      if (d > best) { best = d; first = a.lon + a.lat <= b.lon + b.lat ? a : b; }
    }
  }
  const rest = new Set(units), out = [first]; rest.delete(first);
  let cur = first;
  while (rest.size) {
    let next = null, nd = Infinity;
    for (const u of rest) { const d = haversine(cur, u); if (d < nd) { nd = d; next = u; } }
    out.push(next); rest.delete(next); cur = next;
  }
  return out;
}
function fitAll() {
  if (!routes.length) return;
  const b = routes.reduce((b, r) => [Math.min(b[0], r.bbox[0]), Math.min(b[1], r.bbox[1]), Math.max(b[2], r.bbox[2]), Math.max(b[3], r.bbox[3])],
                          [Infinity, Infinity, -Infinity, -Infinity]);
  map.fitBounds([[b[0], b[1]], [b[2], b[3]]], { padding: { top: 40, left: 30, right: 70, bottom: sheetH() + 20 }, animate: false });
}

// 除外:路線ファイルの excluded(PostGIS側の設定)を基本に、この画面で切り替えた分を上書きする
function isEx(route, u) { const o = (rec(route.ref).ex || {})[u.id]; return o != null ? o : u.fileEx; }
// 0=未走行 1=途中 2=走破 3=除外
function stateOf(route, u) {
  if (isEx(route, u)) return 3;
  const d = rec(route.ref).dist[u.id] || 0;
  return d >= u.th ? 2 : d > 0 ? 1 : 0;
}
function targets(route) { return route.units.filter(u => !isEx(route, u)); }

function exclusionSql(r) {
  const ids = r.units.filter(u => isEx(r, u)).map(u => u.id.replace(/'/g, "''"));
  let sql = `-- ${r.name}:この画面の除外設定をPostGISに書き戻す\n` +
            `DELETE FROM roadshow.unit_manual WHERE route_ref = '${r.ref}' AND manual = 'exclude';\n`;
  if (ids.length) sql += `INSERT INTO roadshow.unit_manual (route_ref, match_id, manual) VALUES\n` +
    ids.map(id => `  ('${r.ref}', '${id}', 'exclude')`).join(',\n') + ';\n';
  return sql;
}

// ---------- [路線]タブ ----------
// 距離は「162.4 km(  3.1 km)」の形。整数部の足りない桁は数字1文字分の空白(U+2007)で埋め、数字は等幅なので路線同士で縦に揃う
function km3(v) { const [i, d] = v.toFixed(1).split('.'); return i.padStart(3, '\u2007') + '.' + d; }
function kmHtml(r) {
  const has = v => v != null && isFinite(v);
  if (!has(r.km) && !has(r.ovKm)) return '';
  const main = has(r.km) ? km3(r.km) + ' km' : '';
  const ov = has(r.ovKm) ? `<span class="ov">(${km3(r.ovKm)} km)</span>` : `<span class="ov none">(\u2007\u20070.0 km)</span>`;
  return `<span class="km num">${main}${ov}</span>`;
}
// route_ref → 路線名(00-013 → 国道13号、06-017 → 山形県道17号)
function refName(ref) {
  const i = refInfo(ref);
  return !i ? ref : i.kind === 'nat' ? `国道${i.no}号` : `${i.pref}道${i.no}号`;
}
function render() {
  const box = $('pRoutes');
  const scroll = box.scrollTop;
  let html = '';
  for (const r of routes) {
    let done = 0;
    for (const u of r.units) {
      const st = stateOf(r, u); if (st === 2) done++;
      map.setFeatureState({ source: r.src, id: u.id }, { st });
    }
    const total = targets(r).length, nEx = r.units.length - total;
    const p = total ? done / total : 0;
    const pct = (Math.floor(p * 1000) / 10).toFixed(1);
    const R = rec(r.ref);
    const list = R.reversed ? [...r.order].reverse() : r.order;
    let lastG = null;
    const items = list.map((u, i) => {
      const d = R.dist[u.id] || 0, st = stateOf(r, u);
      const head = u.grp && u.grp !== lastG ? `<li class="grp">${esc(u.grp)}</li>` : '';
      lastG = u.grp;
      const right = st === 3 ? '除外' : st === 2 ? '<span class="ok">✓</span>'
        : `<span class="d num">${Math.round(d)} / ${Math.round(u.th)} m</span>`;
      return head + `<li class="u ${st === 3 ? 'ex' : st === 1 ? 'part' : ''}"><span class="no num">${pad3(i + 1)}</span>` +
        `<span class="nm">${esc(u.disp)}${u.yomi ? `<span class="yomi">${esc(u.yomi)}</span>` : ''}</span>` +
        `<span class="r">${right}<button class="exb" data-id="${esc(u.id)}">${st === 3 ? '戻す' : '除外'}</button></span></li>`;
    }).join('');
    html += `<div class="route ${R.open ? 'open' : ''}" data-ref="${esc(r.ref)}">
      <div class="rhead"><span class="sgw">${signFor(r.ref, p, 30)}</span>
        <span class="nm">${esc(r.name)}</span>
        ${kmHtml(r)}
        <span class="chev">›</span>
        <button class="icon-btn rm">外す</button>
      </div>
      <div class="prog"><span class="t num">${pad3(done)}/${pad3(total)}・${pct.padStart(5, ' ')}%</span>
        <div class="gauge"><div style="width:${pct}%"></div></div>${nEx ? `<span class="ex">除外 ${nEx}</span>` : ''}</div>
      <div class="units"><div class="cap">▼通過自治体</div><ul>${items}</ul>
        <div class="tools"><button class="rev">起点と終点を入れ替える</button><button class="clr">この路線の記録を消す</button></div></div>
    </div>`;
  }
  html += routes.length ? '' : '<div class="empty">走る予定の路線を「＋ 路線を追加」から選んでください。</div>';
  box.innerHTML = html;
  box.scrollTop = scroll;

  box.querySelectorAll('.route').forEach(div => {
    const r = routes.find(x => x.ref === div.dataset.ref);
    div.querySelector('.rhead').addEventListener('click', e => {
      if (e.target.closest('.rm')) { removeRoute(r); return; }
      const R = rec(r.ref); R.open = !R.open; save(); render();
      if (R.open && sheetH() < innerHeight * .45) setSheet(innerHeight * .6);
    });
    div.querySelectorAll('button.exb').forEach(b => b.addEventListener('click', () => {
      const R = rec(r.ref); R.ex = R.ex || {};
      const u = r.unitById[b.dataset.id];
      R.ex[u.id] = !isEx(r, u);
      if (R.ex[u.id] === u.fileEx) delete R.ex[u.id];   // ファイルの設定と同じなら上書きを消す
      save(); render();
    }));
    div.querySelector('.rev').addEventListener('click', () => { const R = rec(r.ref); R.reversed = !R.reversed; save(); render(); });
    div.querySelector('.clr').addEventListener('click', () => {
      if (!confirm(`${r.name}の走破記録を消します。よろしいですか?\n(除外と並び順の設定は残ります)`)) return;
      const R = rec(r.ref); R.dist = {}; R.lastTime = null; save(); render();
      toast(`${r.name}の記録を消しました`);
    });
  });
}
$('btnAdd').addEventListener('click', openCatalog);

// ---------- 軌跡(GPX) ----------
const tracks = [];   // { id, fn, pts, t0, t1, km, color, pending, shown }
let trkSeq = 0, tracksShown = true;
function firstTrackLayer() { const t = tracks.find(t => map.getLayer('trk-' + t.id)); return t ? 'trk-' + t.id : undefined; }
function trackLen(pts) {
  let d = 0;
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i];
    if (a.t != null && b.t != null && b.t - a.t > MAX_GAP_MIN * 60000) continue;
    d += haversine(a, b);
  }
  return d;
}
function trackGeo(pts) {
  // 30分以上空いたところで線を切る
  const lines = []; let cur = [];
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i], q = pts[i - 1];
    if (q && q.t != null && p.t != null && p.t - q.t > MAX_GAP_MIN * 60000) { if (cur.length > 1) lines.push(cur); cur = []; }
    cur.push([p.lon, p.lat]);
  }
  if (cur.length > 1) lines.push(cur);
  return { type: 'Feature', properties: {}, geometry: { type: 'MultiLineString', coordinates: lines } };
}
function styleTrack(t) {
  const id = 'trk-' + t.id;
  if (!map.getLayer(id)) return;
  map.setLayoutProperty(id, 'visibility', t.shown && tracksShown ? 'visible' : 'none');
  map.setPaintProperty(id, 'line-dasharray', t.pending ? [2, 1.2] : [1, 0]);
  map.setPaintProperty(id, 'line-width', t.pending ? 3.5 : 3);
}
async function addTrack(fn, pts) {
  await mapReady;
  const t = { id: ++trkSeq, fn, pts, t0: pts[0].t, t1: pts[pts.length - 1].t, km: trackLen(pts) / 1000,
              color: TRACK_COLORS[(trkSeq - 1) % TRACK_COLORS.length], pending: true, shown: true };
  tracks.push(t);
  map.addSource('trk-' + t.id, { type: 'geojson', data: trackGeo(pts) });
  map.addLayer({ id: 'trk-' + t.id, type: 'line', source: 'trk-' + t.id,
    layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': t.color, 'line-opacity': .85 } });
  styleTrack(t);
  return t;
}
function removeTrack(t) {
  if (map.getLayer('trk-' + t.id)) map.removeLayer('trk-' + t.id);
  if (map.getSource('trk-' + t.id)) map.removeSource('trk-' + t.id);
  tracks.splice(tracks.indexOf(t), 1);
}
function fitTrack(t) {
  let b = [Infinity, Infinity, -Infinity, -Infinity];
  for (const p of t.pts) { b = [Math.min(b[0], p.lon), Math.min(b[1], p.lat), Math.max(b[2], p.lon), Math.max(b[3], p.lat)]; }
  map.fitBounds([[b[0], b[1]], [b[2], b[3]]], { padding: { top: 40, left: 30, right: 70, bottom: sheetH() + 20 }, animate: true, maxZoom: 14 });
}

// 判定:時刻の早いGPXから順に足し込む(遅いものを先に判定すると、前回の続きだけ数える仕組みで早いものが無視されるため)
function judgeTracks(list) {
  if (!routes.length) { toast('先に路線を追加してください。'); return; }
  list = [...list].sort((a, b) => (a.t0 ?? Infinity) - (b.t0 ?? Infinity));
  const before = new Map(routes.map(r => [r.ref, new Set(r.units.filter(u => stateOf(r, u) === 2).map(u => u.id))]));
  let noTime = false;
  for (const t of list) {
    const nt = t.pts.some(p => p.t == null); noTime = noTime || nt;
    for (const r of routes) {
      const { add, maxT } = judgeRoute(r, t.pts);
      const R = rec(r.ref);
      for (const id in add) R.dist[id] = (R.dist[id] || 0) + add[id];
      if (maxT != null && !nt) R.lastTime = new Date(maxT).toISOString();
    }
    t.pending = false; styleTrack(t);
  }
  save(); render();
  const msgs = [], completed = [];
  for (const r of routes) {
    const nowDone = r.units.filter(u => stateOf(r, u) === 2);
    const fresh = nowDone.filter(u => !before.get(r.ref).has(u.id));
    const total = targets(r).length;
    if (fresh.length) msgs.push(`${r.name}:新たに走破 ${fresh.length} 町村`);
    if (fresh.length && total && nowDone.length === total) completed.push(r.name);
  }
  if (noTime) msgs.push('※時刻の無い点があるため、重複読み込みの防止は効きません。');
  toast(msgs.length ? msgs.join('\n') : '判定しました(新たに走破した町村はありません)');
  // 完了の演出は、上のお知らせが消えてから出る
  completed.forEach(n => Banner.show({ label: '完了', title: n }));
  renderTracks();
}

function fmtRange(t) {
  if (t.t0 == null) return '時刻なし';
  const d = new Date(t.t0), e = new Date(t.t1);
  const two = n => String(n).padStart(2, '0');
  const md = x => `${x.getMonth() + 1}/${two(x.getDate())}`, hm = x => `${two(x.getHours())}:${two(x.getMinutes())}`;
  return md(d) + ' ' + hm(d) + '–' + (md(d) === md(e) ? '' : md(e) + ' ') + hm(e);
}
function renderTracks() {
  const pend = tracks.filter(t => t.pending), done = tracks.filter(t => !t.pending);
  const card = t => `<div class="trk ${t.pending ? 'pending' : ''} ${t.shown ? '' : 'hidden'}" data-id="${t.id}">
    <div class="top"><span class="sw" style="background:${t.color}"></span><span class="fn">${esc(t.fn)}</span>
      ${t.pending ? '' : `<button class="icon-btn eye">${t.shown ? '隠す' : '表示'}</button><button class="icon-btn del" title="画面から消す">×</button>`}</div>
    <div class="meta num">${fmtRange(t)}・${t.km.toFixed(1)} km</div>
    ${t.pending ? `<div class="acts"><button class="btn primary judge">判定する</button><button class="btn ghost cancel">取り消す</button><button class="btn ghost look">地図で見る</button></div>` : ''}
  </div>`;
  let html = '';
  if (pend.length) {
    html += `<div class="sec">判定待ち</div>` + pend.map(card).join('');
    if (pend.length > 1) html += `<button class="btn primary wide" id="judgeAll">${pend.length} 件をまとめて判定する</button>`;
  }
  html += `<div class="sec">読み込んだ軌跡</div>` +
    (done.map(card).join('') || '<div class="empty" style="padding-top:0">まだありません。判定した軌跡がここに並びます(ページを開き直すと消えます。記録は残ります)。</div>');
  html += `<label class="btn wide" for="fGpx">GPXを読み込む</label>`;
  $('pTracks').innerHTML = html;
  $('pTracks').querySelectorAll('.trk').forEach(el => {
    const t = tracks.find(x => x.id === +el.dataset.id);
    const on = (sel, fn) => { const b = el.querySelector(sel); if (b) b.addEventListener('click', fn); };
    on('.judge', () => judgeTracks([t]));
    on('.cancel', () => { removeTrack(t); renderTracks(); toast('取り消しました'); });
    on('.look', () => { fitTrack(t); });
    on('.eye', () => { t.shown = !t.shown; styleTrack(t); renderTracks(); });
    on('.del', () => { removeTrack(t); renderTracks(); });
  });
  const ja = $('judgeAll'); if (ja) ja.addEventListener('click', () => judgeTracks(tracks.filter(t => t.pending)));
  document.querySelector('.tab[data-p=pTracks]').innerHTML = '軌跡' + (pend.length ? '<span class="dot"></span>' : '');
}

$('fGpx').addEventListener('change', async e => {
  const files = [...e.target.files]; e.target.value = '';
  let last = null;
  for (const f of files) {
    try {
      const pts = parseGpx(await f.text());
      if (pts.length < 2) { toast(f.name + ':軌跡の点がありません'); continue; }
      last = await addTrack(f.name, pts);
    } catch (err) { toast(f.name + ':読めませんでした(' + err.message + ')'); }
  }
  if (last) {
    showTab('pTracks'); if (sheetH() < innerHeight * .4) setSheet(innerHeight * .5);
    renderTracks(); fitTrack(last);
  }
});
$('fabTrk').addEventListener('click', () => {
  tracksShown = !tracksShown; $('fabTrk').classList.toggle('off', !tracksShown);
  tracks.forEach(styleTrack);
  toast(tracksShown ? '軌跡を表示しました' : '軌跡を隠しました', 1200);
});

// ---------- 路線の一覧(routes.json)と端末への保存 ----------
const CAT_URL = params.get('catalog') || 'routes.json';
let catalog = [], catErr = '', catLoading = null;
const hasCache = () => 'caches' in window;
const absPath = f => new URL(f, location.href).pathname;
async function cachedFiles() {
  if (!hasCache()) return new Set();
  try { const c = await caches.open(CACHE); return new Set((await c.keys()).map(r => new URL(r.url).pathname)); }
  catch (e) { return new Set(); }
}
async function fetchRoute(file) {
  // 端末に保存してあればそれを使う(圏外でも読める)。無ければ取りに行く
  if (hasCache()) {
    try { const hit = await (await caches.open(CACHE)).match(file); if (hit) return await hit.json(); } catch (e) {}
  }
  const res = await fetch(file, { cache: 'no-cache' });
  if (!res.ok) throw new Error(res.status + ' ' + file);
  return await res.json();
}
const catEntry = file => catalog.find(c => c.file === file);
async function saveOffline(file) {
  const c = await caches.open(CACHE);
  const res = await fetch(file, { cache: 'no-cache' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  await c.put(file, res);
  const e = catEntry(file); if (e && e.hash) { app.hashes[file] = e.hash; saveApp(); }
}
async function deleteOffline(file) { const c = await caches.open(CACHE); await c.delete(file); delete app.hashes[file]; saveApp(); }

async function loadCatalog() {
  if (catLoading) return catLoading;
  catLoading = (async () => {
    const url = new URL(CAT_URL, location.href).href;
    try {
      const res = await fetch(url, { cache: 'no-cache' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const j = await res.json();
      if (!Array.isArray(j)) throw new Error('中身が一覧の形ではありません');
      catalog = j; catErr = j.length ? '' : '一覧は0件でした';
    } catch (e) { catalog = []; catErr = (e.message || String(e)) + '\n' + url; }
    catLoading = null;
    renderCatalog();
  })();
  return catLoading;
}
// 端末に保存した路線ファイルが新しくなっていたら、取り直して入れ替える
async function syncSaved() {
  if (!hasCache() || !catalog.length) return;
  const saved = await cachedFiles();
  const c = await caches.open(CACHE);
  const updated = [];
  for (const e of catalog) {
    if (!e.hash || !saved.has(absPath(e.file)) || app.hashes[e.file] === e.hash) continue;
    try {
      const res = await fetch(e.file, { cache: 'no-cache' });
      if (!res.ok) continue;
      const gj = await res.clone().json();
      await c.put(e.file, res);
      app.hashes[e.file] = e.hash; saveApp();
      const r = routes.find(r => r.file === e.file);
      if (r) await replaceRoute(r, gj);
      updated.push(e.name);
    } catch (err) { /* 圏外などのときは次の機会に */ }
  }
  if (updated.length) { toast('路線ファイルを新しくしました:' + updated.join('、')); renderCatalog(); }
}

function openCatalog() {
  $('cat').classList.add('on');
  if (!catalog.length && !catLoading) loadCatalog();
  renderCatalog();
}
$('catClose').addEventListener('click', () => $('cat').classList.remove('on'));
$('catQ').addEventListener('input', () => renderCatalog());

async function renderCatalog() {
  const box = $('catList');
  if (!$('cat').classList.contains('on')) return;
  if (!catalog.length) {
    box.innerHTML = catLoading ? '<div class="caterr">一覧を読み込み中…</div>' :
      `<div class="caterr">路線の一覧(routes.json)を読めませんでした。「⋯」の「ファイルから路線を読み込む」で直接開けます。<small>${esc(catErr)}</small></div>`;
    return;
  }
  const q = $('catQ').value.trim();
  const saved = await cachedFiles();
  const rows = catalog.filter(c => !q || (c.name + ' ' + c.ref + ' ' + (refInfo(c.ref) || {}).no).includes(q));
  const groups = new Map();
  for (const c of rows) {
    const i = refInfo(c.ref);
    const key = !i ? '99' : i.kind === 'nat' ? '00' : String(i.pc).padStart(2, '0');
    const title = !i ? 'その他' : i.kind === 'nat' ? '国道' : i.pref + '道';
    if (!groups.has(key)) groups.set(key, { title, list: [] });
    groups.get(key).list.push(c);
  }
  const keys = [...groups.keys()].sort();
  box.innerHTML = keys.map(k => {
    const g = groups.get(k);
    return `<div class="sech">${esc(g.title)}</div>` + g.list.map(c => {
      const on = routes.some(r => r.file === c.file);
      const sv = saved.has(absPath(c.file));
      const sz = c.size_kb ? (c.size_kb >= 1024 ? (c.size_kb / 1024).toFixed(1) + ' MB' : c.size_kb + ' KB') : '';
      return `<div class="ci"><div class="sgw">${signFor(c.ref, null, 30)}</div>
        <div class="tx"><b>${esc(c.name)}</b><small class="num">${sz}${sv ? '・端末に保存済み' : ''}</small></div>
        ${hasCache() ? `<button class="dl ${sv ? 'saved' : ''}" data-f="${esc(c.file)}" title="${sv ? '保存を消す' : '端末に保存'}">
          <svg viewBox="0 0 24 24">${sv ? '<path d="M5 12l4 4 10-10"/>' : '<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>'}</svg></button>` : ''}
        <button class="use ${on ? 'on' : ''}" data-f="${esc(c.file)}">${on ? '使用中' : '使う'}</button></div>`;
    }).join('');
  }).join('') || '<div class="caterr">該当する路線がありません。</div>';
  box.querySelectorAll('.use').forEach(b => b.addEventListener('click', () => toggleUse(b.dataset.f)));
  box.querySelectorAll('.dl').forEach(b => b.addEventListener('click', async () => {
    const f = b.dataset.f;
    try {
      if (b.classList.contains('saved')) {
        if (!confirm('この端末に保存した路線ファイルを消します(走破の記録は消えません)。')) return;
        await deleteOffline(f); toast('保存を消しました', 1200);
      } else {
        b.classList.add('busy'); await saveOffline(f); toast('端末に保存しました', 1200);
      }
    } catch (e) { toast('保存できませんでした:' + e.message); }
    renderCatalog();
  }));
}
async function useFile(file, opt) {
  try { await addRoute(await fetchRoute(file), file, file, opt); }
  catch (e) { toast('路線ファイルを読めませんでした:' + e.message); }
}
async function toggleUse(file) {
  const r = routes.find(r => r.file === file);
  if (r) removeRoute(r); else await useFile(file);
  renderCatalog();
}

$('fRoute').addEventListener('change', async e => {
  const files = [...e.target.files]; e.target.value = '';
  for (const f of files) {
    try { await addRoute(JSON.parse(await f.text()), f.name); showTab('pRoutes'); }
    catch (err) { toast(err.message); }
  }
});

// ---------- ⋯ タブ ----------
$('btnSql').addEventListener('click', () => {
  const box = $('sqlBox'), ta = box.querySelector('textarea');
  box.hidden = false;
  ta.value = routes.length ? routes.map(exclusionSql).join('\n') : '-- 使っている路線がありません';
  ta.focus(); ta.select();
});
$('btnReset').addEventListener('click', () => {
  if (!confirm('この端末に保存した走破記録を消します。よろしいですか?')) return;
  store = {}; save(); render();
  toast('記録を消しました');
});

// ---------- タブ ----------
function showTab(id) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.p === id));
  document.querySelectorAll('.pane').forEach(p => p.classList.toggle('on', p.id === id));
  $('addBar').hidden = id !== 'pRoutes';
}
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  showTab(t.dataset.p); if (sheetH() < 200) setSheet(innerHeight * .5);
}));

// ---------- 引き出しパネル ----------
const sheet = $('sheet');
const snaps = () => [150, innerHeight * .5, innerHeight * .88];
const sheetH = () => sheet.getBoundingClientRect().height;
function setSheet(h) { sheet.style.height = Math.round(h) + 'px'; }
(() => {
  let y0 = null, h0 = 0, moved = false;
  const g = $('grab');
  g.addEventListener('pointerdown', e => { y0 = e.clientY; h0 = sheetH(); moved = false; sheet.classList.add('dragging'); g.setPointerCapture(e.pointerId); });
  g.addEventListener('pointermove', e => {
    if (y0 == null) return; const dy = y0 - e.clientY; if (Math.abs(dy) > 4) moved = true;
    setSheet(Math.max(110, Math.min(innerHeight * .92, h0 + dy)));
  });
  const end = () => {
    if (y0 == null) return; sheet.classList.remove('dragging');
    const h = sheetH(), s = snaps();
    if (!moved) { const i = s.findIndex(v => Math.abs(v - h) < 30); setSheet(s[(i + 1) % s.length]); }
    else setSheet(s.reduce((a, b) => Math.abs(b - h) < Math.abs(a - h) ? b : a));
    y0 = null;
  };
  g.addEventListener('pointerup', end); g.addEventListener('pointercancel', end);
})();

// ---------- 重用区間をタップ ----------
map.on('click', e => {
  const layers = routes.map(r => r.src + '-dup').filter(id => map.getLayer(id));
  if (!layers.length) return;
  const p = e.point;
  const fs = map.queryRenderedFeatures([[p.x - 12, p.y - 12], [p.x + 12, p.y + 12]], { layers });
  if (!fs.length) return;
  const msgs = [...new Set(fs.map(f => {
    const r = routes.find(r => r.src === f.source);
    const others = String(f.properties.dup_refs || '').split(';').filter(Boolean).map(x => '(重)' + refName(x));
    return [r ? r.name : ''].concat(others).join('\n');
  }))];
  toast(msgs.join('\n\n'));
});

// ---------- 方位磁針(地図が回転・傾いているときだけ出す) ----------
function updateNorth() {
  const b = map.getBearing(), p = map.getPitch();
  const off = Math.abs(b) > 0.5 || p > 0.5;
  $('fabNorth').hidden = !off;
  $('fabNorth').querySelector('svg').style.transform = `rotate(${-b}deg)`;
}
map.on('rotate', updateNorth); map.on('pitch', updateNorth);
$('fabNorth').addEventListener('click', () => map.easeTo({ bearing: 0, pitch: 0, duration: 400 }));

// ---------- 現在地 ----------
let watchId = null, meMarker = null, firstFix = false;
$('fabLoc').addEventListener('click', () => {
  if (!navigator.geolocation) { toast('この環境では位置情報を使えません'); return; }
  if (watchId != null) {
    navigator.geolocation.clearWatch(watchId); watchId = null;
    $('fabLoc').classList.remove('on'); if (meMarker) meMarker.remove(); meMarker = null;
    return;
  }
  $('fabLoc').classList.add('on'); firstFix = true;
  watchId = navigator.geolocation.watchPosition(pos => {
    const ll = [pos.coords.longitude, pos.coords.latitude];
    if (!meMarker) { const el = document.createElement('div'); el.className = 'me'; meMarker = new maplibregl.Marker({ element: el }); }
    meMarker.setLngLat(ll).addTo(map);
    if (firstFix) { map.easeTo({ center: ll, zoom: Math.max(map.getZoom(), 13) }); firstFix = false; }
  }, err => {
    toast('位置を取得できませんでした:' + err.message);
    navigator.geolocation.clearWatch(watchId); watchId = null; $('fabLoc').classList.remove('on');
  }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
});

// ---------- 起動 ----------
// 前回「使う」にしていた路線と、?route=URL1,URL2 で指定した路線を読み込む
render(); renderTracks();
(async () => {
  const cat = loadCatalog();   // 一覧は路線の読み込みを待たずにすぐ取りに行く
  const list = [...new Set([...app.active, ...(params.get('route') || '').split(',').filter(Boolean)])];
  for (const f of list) await useFile(f, { quiet: true });
  fitAll();
  await cat;
  syncSaved();
})();
</script>
